name: Verify and deploy JudyQuest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build for Sites
        run: npm run build
      - name: Verify Sites PWA
        run: node scripts/check-pwa.mjs /
      - name: Save verified Sites build for manual publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: judyquest-sites-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Build for GitHub Pages
        run: npm run build
        env:
          JUDY_BASE_PATH: /JudyQuest/
      - name: Verify GitHub Pages PWA
        run: node scripts/check-pwa.mjs /JudyQuest/
      - name: Upload GitHub Pages build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
